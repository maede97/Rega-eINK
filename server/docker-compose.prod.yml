services:
  api:
    image: ghcr.io/maede97/rega-eink-server:latest
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: always
    networks:
      - default
      - traefik-proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-proxy'
      - 'traefik.http.routers.rega-eink-server.rule=Host(`rega.hueppis.com`)'
      - 'traefik.http.routers.rega-eink-server.entrypoints=websecure'
      - 'traefik.http.routers.rega-eink-server.tls=true'
      - 'traefik.http.routers.rega-eink-server.tls.certresolver=letsencrypt'
      - 'traefik.http.services.rega-eink-server.loadbalancer.server.port=8000'
    volumes:
      - ./flights.db:/app/flights.db
      - ./api_keys.txt:/app/api_keys.txt

  fetcher:
    image: ghcr.io/maede97/rega-eink-server:latest
    command: ["python", "fetch_current_data.py"]
    restart: no
    volumes:
      - ./flights.db:/app/flights.db
      - ./api_keys.txt:/app/api_keys.txt

networks:
  traefik-proxy:
    external: true
